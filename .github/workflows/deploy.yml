name: Deploy Sai Techverse to MilesWeb

on:
  push:
    branches:
      - main  

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v4 # UPDATED

      - name: Setup Node.js
        uses: actions/setup-node@v4 # UPDATED
        with:
          node-version: '22' # UPDATED

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Static Export
        run: npm run build

      - name: Sync files to MilesWeb via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_SERVER_USERNAME }}
          password: ${{ secrets.FTP_SERVER_PASSWORD }}
          local-dir: ./out/
          server-dir: ./ # Remember to change to ./ if your FTP goes directly here